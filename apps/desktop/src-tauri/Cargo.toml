[package]
name = "mytowncart-billing"
version = "0.1.2"
description = "MyTownCart Billing desktop shell"
edition = "2021"
rust-version = "1.77.2"
license = "Apache-2.0"

[lib]
name = "mytowncart_billing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
thiserror = "2"
# .mtcb snapshots are gzip'd before encryption (roadmap §8.7); pure-Rust backend.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tiny_http = "0.12"
getrandom = "0.3"
sha2 = "0.10"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
