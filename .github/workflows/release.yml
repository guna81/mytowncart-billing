# SPDX-License-Identifier: Apache-2.0
name: Release

# Tag-triggered (owner runs the tag): builds installers on all three OSes and
# attaches them, with SHA-256 checksums (D12: unsigned builds + checksums so
# users can verify what they run), to one GitHub Release via tauri-action.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify-version:
    name: Tag matches app version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag against tauri.conf.json, Cargo.toml and APP_VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          cargo=$(grep -m1 '^version' apps/desktop/src-tauri/Cargo.toml | cut -d'"' -f2)
          core=$(grep -oE 'APP_VERSION = "[^"]+"' packages/core/src/index.ts | cut -d'"' -f2)
          echo "tag=$tag tauri=$conf cargo=$cargo core=$core"
          for v in "$conf" "$cargo" "$core"; do
            [ "$v" = "$tag" ] || { echo "::error::Version mismatch: tag $tag vs $v. Bump all version files, then tag again."; exit 1; }
          done

  build-installers:
    needs: verify-version
    name: ${{ matrix.platform }}${{ matrix.required == true && ' (supported)' || ' (community build)' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            required: true
            platform: windows-x64
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            required: false
            platform: macos-arm64
            target: aarch64-apple-darwin
          - os: macos-latest
            required: false
            platform: macos-x64
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            required: false
            platform: linux-x64
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri + WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build and attach installers to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm exec tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: "MyTownCart Billing ${{ github.ref_name }}"
          releaseBody: |
            Unsigned builds (no code-signing certificates yet — see DECISIONS.md / roadmap D12).
            - Windows (supported): allow the SmartScreen prompt via "More info → Run anyway".
            - macOS (community build): Gatekeeper blocks unsigned builds with "is damaged and can't be opened". Move the app to Applications and run `xattr -cr "/Applications/MyTownCart Billing.app"` in Terminal.
            - Linux (community build): `chmod +x` the AppImage or install the `.deb`.
            Verify downloads against the attached SHA-256 checksums.
          releaseDraft: true
          prerelease: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Upload stable download filenames and SHA-256 checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOWNLOAD_PLATFORM: ${{ matrix.platform }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tooling/release-downloads.py

  publish:
    name: Publish release
    needs: build-installers
    runs-on: ubuntu-latest
    steps:
      - name: Require the Windows installer, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | tee assets.txt
          for f in "MyTownCart-Billing-windows-x64.exe" "checksums-windows-x64.txt"; do
            grep -qx "$f" assets.txt || { echo "::error::$f is missing; leaving the release as a draft."; exit 1; }
          done
          # Tags like v1.2.0-rc1 are published as pre-releases and never become "latest".
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease=false --latest
          fi
          echo "Missing community builds (informational):"
          for f in macos-arm64.dmg macos-x64.dmg linux-x64.deb linux-x64.AppImage; do
            grep -qx "MyTownCart-Billing-$f" assets.txt || echo "  - $f"
          done

  site:
    name: Refresh download page
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
