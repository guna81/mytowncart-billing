# SPDX-License-Identifier: Apache-2.0
name: Release

# Tag-triggered (owner runs the tag): builds installers on all three OSes and
# attaches them, with SHA-256 checksums (D12: unsigned builds + checksums so
# users can verify what they run), to one GitHub Release via tauri-action.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-installers:
    name: ${{ matrix.os }}${{ matrix.required && '' || ' (community build)' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            required: true
          - os: macos-latest
            required: false
          - os: ubuntu-latest
            required: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri + WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build and attach installers to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "MyTownCart Billing ${{ github.ref_name }}"
          releaseBody: |
            Unsigned builds (no code-signing certificates yet — see DECISIONS.md / roadmap D12).
            - Windows (supported): allow the SmartScreen prompt via "More info → Run anyway".
            - macOS / Linux: unsupported community builds; macOS needs right-click → Open.
            Verify downloads against the attached SHA-256 checksums.
          releaseDraft: true
          prerelease: false

      - name: SHA-256 checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd apps/desktop/src-tauri/target/release/bundle
          sum() { if command -v sha256sum >/dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          out="checksums-${{ matrix.os }}.txt"
          : > "$out"
          find . -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -print0 \
            | while IFS= read -r -d '' f; do sum "$f" >> "$out"; done
          cat "$out"
          gh release upload "${{ github.ref_name }}" "$out" --clobber
